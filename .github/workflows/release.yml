name: npm release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      dist-tag: ${{ steps.metadata.outputs.dist_tag }}
      package-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release metadata and publishing gate
        id: metadata
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run example
      - name: Build, inspect, and install the release package
        run: npm run release:pack
      - name: Record validated package digest
        id: package
        run: echo "sha256=$(sha256sum .release/package.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-package
          path: .release/package.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    if: >-
      needs.validate.outputs.publish == 'true' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      github.repository == 'TechSologic/federation-privacy-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-package
          path: .release
      - name: Verify downloaded package digest
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.package-sha256 }}
        run: echo "$EXPECTED_SHA256  .release/package.tgz" | sha256sum --check --strict
      - name: Publish the validated artifact using OIDC
        env:
          NPM_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
        run: >-
          npm publish .release/package.tgz --access public
          --tag "$NPM_DIST_TAG" --ignore-scripts
          --registry https://registry.npmjs.org
